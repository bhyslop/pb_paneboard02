[package]
name = "paneboard-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
libc = "0.2"
lazy_static = "1.4"
quick-xml = "0.31"
dirs = "5.0"
single-instance = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSDictionary", "NSValue", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSScreen", "NSRunningApplication", "NSApplication", "NSResponder", "NSGraphics", "NSColorSpace"] }
block2 = "0.6"

# No debug info in dev builds: it is most of target/ (~1.6 GB with it on).
[profile.dev]
debug = false
